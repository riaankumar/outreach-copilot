app = "outreach-copilot-api"
primary_region = "sjc"

[build]

[env]
  DATABASE_URL = "sqlite:////data/copilot.db"

[[mounts]]
  source = "copilot_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 50
    soft_limit = 25

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
